<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Template Generator - POC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
    <title>Document Template Generator - POC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Open Sans", "Helvetica Neue", "Helvetica", sans-serif;
            background: #eceef1 0%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 2px;
            font-size: 15px;
            background-color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        select:hover {
            border-color: #667eea;
        }
        
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }
        
        .config-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        
        .config-section h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
        }
        
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-item label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }
        
        button {
            width: 100%;
            padding: 14px 24px;
            background: #65a6de;
            color: white;
            border: none;
            border-radius: 2px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        button:active:not(:disabled) {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .status-message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .metadata {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        /* Tom Select styling to match form */
        .ts-wrapper.single .ts-control {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 2px;
            font-size: 15px;
        }
        .ts-wrapper.single .ts-control:hover {
            border-color: #667eea;
        }
        .ts-wrapper.single.focus .ts-control {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Certificate Template Generator</h1>
        <p class="subtitle">Generate documents from templates and resource data</p>
        
        <div class="info-box">
            Select a resource instance and a template to generate your document
        </div>
        
        <form id="templateForm">
            <div class="form-group">
                <label for="resourceSelect">Select Resource Instance</label>
            <select id="resourceSelect" name="resource" required placeholder="Search resources...">
                    <option value="">Loading resources...</option>
                </select>
                <div class="metadata" id="resourceMeta"></div>
            </div>
            
            <div class="form-group">
                <label for="templateSelect">Select Template</label>
                <select id="templateSelect" name="template" required>
                    <option value="">Loading templates...</option>
                </select>
                <div class="metadata" id="templateMeta"></div>
                <div class="checkbox-item" style="margin-top: 8px;">
                    <input type="checkbox" id="showAllVersions">
                    <label for="showAllVersions">Show all versions (including archived)</label>
                </div>
            </div>
            
            <button type="submit" id="generateBtn">
                Generate Document
            </button>
        </form>
        
        <div id="statusMessage" class="status-message"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <script>
        console.log('Certificate Generator Plugin loaded');
        // Configuration
        const API_BASE = window.location.origin;

        let resources = [];
        let templates = [];
        let resourceSelect;
        
        // Load resources on page load
        async function loadResources() {
            try {
                // const response = await fetch(`${API_BASE}/search/resources?format=json`);
                const response = await fetch(`${API_BASE}/certificate-generator/get-resources/`);
                const data = await response.json();
                
                resources = data.resources;
                console.log('Resources:', resources);

                // Initialize Tom Select with the loaded resources
                resourceSelect = new TomSelect('#resourceSelect', {
                    placeholder: 'Search resources...',
                    options: Object.values(resources).map(r => ({
                        value: r.resource_id,
                        text: `${r.place_id} ${r.name}`
                    })),
                    searchField: ['text'],
                    maxOptions: 100,
                    onChange: updateResourceMeta
                });
                console.log(Object.values(resources));
                console.log(resourceSelect.options);

            } catch (error) {
                console.error('Error loading resources:', error);
                showMessage('Failed to load resources: ' + error.message, 'error');
            }
        }
        
        // Load templates on page load
        async function loadTemplates() {
            try {
                const showAll = document.getElementById('showAllVersions').checked;
                const params = new URLSearchParams();
                if (showAll) {
                    params.set('include_archived', 'true');
                }
                console.log('Loading templates with params:', params);

                const response = await fetch(`${API_BASE}/certificate-generator/templates?${params}`);
                const data = await response.json();

                templates = data.templates || [];

                const select = document.getElementById('templateSelect');

                if (templates.length === 0) {
                    select.innerHTML = '<option value="">No templates available</option>';
                    return;
                }

                let html = '<option value="">-- Select a template --</option>';

                for (const t of templates) {
                    if (showAll && t.versions.length > 1) {
                        html += `<optgroup label="${t.name}">`;
                        for (const v of t.versions) {
                            const label = `v${v.version} (${v.status})`;
                            const desc = v.changelog ? ` - ${v.changelog.substring(0, 50)}` : '';
                            html += `<option value="${t.id}:${v.version}">${label}${desc}</option>`;
                        }
                        html += '</optgroup>';
                    } else {
                        const pv = t.published_version;
                        const vLabel = pv ? ` (v${pv.version})` : '';
                        const value = pv ? `${t.id}:${pv.version}` : t.id;
                        html += `<option value="${value}">${t.name}${vLabel}</option>`;
                    }
                }

                select.innerHTML = html;

            } catch (error) {
                console.error('Error loading templates:', error);
                showMessage('Failed to load templates: ' + error.message, 'error');
            }
        }
        
        // Show resource metadata when selected (called from Tom Select onChange)
        function updateResourceMeta(resourceId) {
            const metaDiv = document.getElementById('resourceMeta');
            if (resourceId) {
                const resource = resources.find(r => r.resource_id === resourceId);
                if (resource) {
                    metaDiv.textContent = `Graph: ${resource.graph_id || 'N/A'} | Fields: ${resource.fields_count || 0}`;
                }
            } else {
                metaDiv.textContent = '';
            }
        }
        
        // Show template metadata when selected
        document.getElementById('templateSelect').addEventListener('change', (e) => {
            const value = e.target.value;
            const metaDiv = document.getElementById('templateMeta');

            if (!value) {
                metaDiv.innerHTML = '';
                return;
            }

            let templateId, versionNum;
            if (value.includes(':')) {
                [templateId, versionNum] = value.split(':');
                versionNum = parseInt(versionNum);
            } else {
                templateId = value;
            }

            const template = templates.find(t => t.id === templateId);
            if (!template) return;

            const ver = versionNum
                ? template.versions.find(v => v.version === versionNum)
                : template.published_version;

            if (ver) {
                const sizeKB = (ver.size / 1024).toFixed(1);
                const date = new Date(ver.created_at).toLocaleDateString();
                metaDiv.innerHTML =
                    `<strong>v${ver.version}</strong> (${ver.status}) | ` +
                    `Size: ${sizeKB} KB | By: ${ver.created_by} | ${date}<br>` +
                    `<em>${ver.changelog}</em>`;
            }
        });

        // Reload templates when "Show all versions" is toggled
        document.getElementById('showAllVersions').addEventListener('change', loadTemplates);
        
        // Handle form submission
        document.getElementById('templateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resource = document.getElementById('resourceSelect');
            const resourceId = resource.value;
            const resourceName = resource.options[resource.selectedIndex]?.text || 'N/A';

            const templateValue = document.getElementById('templateSelect').value;
            let templateId, templateVersion;
            if (templateValue.includes(':')) {
                [templateId, templateVersion] = templateValue.split(':');
                templateVersion = parseInt(templateVersion);
            } else {
                templateId = templateValue;
                templateVersion = null;
            }

            if (!resourceId || !templateId) {
                showMessage('Please select both a resource and a template', 'error');
                return;
            }
            
            // Disable button and show loading
            const btn = document.getElementById('generateBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Generating...';
            
            showMessage('Processing your request...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/certificate-generator/process-template/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken'),
                    },
                    body: JSON.stringify({
                        resource_id: resourceId,
                        resource_name: resourceName,
                        template_id: templateId,
                        template_version: templateVersion,
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to generate document');
                }
                
                // Get the blob and trigger download
                const blob = await response.blob();
                console.log(blob);
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                
                // Extract filename from Content-Disposition header or create one
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = 'document.docx';
                if (contentDisposition) {
                    const matches = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/.exec(contentDisposition);
                    if (matches && matches[1]) {
                        filename = matches[1].replace(/['"]/g, '');
                    }
                }
                
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                console.log('Document generated and download triggered:', filename);
                showMessage(`✓ Document generated successfully: ${filename}`, 'success');
                
            } catch (error) {
                console.error('Error generating document:', error);
                showMessage('Failed to generate document: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookie.slice(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        // Show status message
        function showMessage(message, type) {
            const messageDiv = document.getElementById('statusMessage');
            messageDiv.textContent = message;
            messageDiv.className = `status-message ${type}`;
            messageDiv.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 5000);
            }
        }
        
        // // Initialize
        // document.addEventListener('DOMContentLoaded', () => {
            console.log('Initializing Certificate Generator Plugin');
            loadResources();
            loadTemplates();
        // });
    </script>
</body>
</html>
